apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-and-test:
    steps:
      - name: Get source code
        uses: cloudbees-io/checkout@v1

      # Scoped to the :caffeine module only. This is a large multi-module
      # Gradle build with a heavyweight verification suite (checkstyle,
      # error-prone, javadoc, animalSniffer, additional TestNG conformance
      # suites, jcstress, pitest, etc.) that isn't appropriate for a basic
      # CI check, so we call the specific compileJava/jar/test tasks on the
      # core module rather than the default build/check tasks. The build's
      # own Gradle toolchain resolver (foojay-resolver-convention) downloads
      # whatever JDK the build actually needs for compilation; this image
      # only needs a JDK new enough to run Gradle 9 itself.
      # Settings evaluation resolves the com.gradle.develocity plugin (and
      # its transitive gradle-versions-plugin -> moshi-kotlin dependency)
      # from Maven Central/Plugin Portal on every fresh run, regardless of
      # which task is targeted, and this CI runner hits a sustained
      # "429 Too Many Requests" doing so (not a brief blip - 3 immediate
      # retries all failed identically). The project's own
      # settings.gradle.kts / gradle/plugins/settings.gradle.kts already
      # add a Google-hosted Maven Central mirror to both the plugin and
      # dependency repositories, gated behind `providers.environmentVariable
      # ("CI").isPresent` - this is the project's own intended escape hatch
      # for exactly this problem, so set CI=true rather than fighting the
      # rate limit with retries. A short retry loop is kept as cheap
      # insurance for anything else transient.
      - name: Compile
        uses: docker://eclipse-temurin:21-jdk
        shell: sh
        run: |
          export CI=true
          for i in 1 2 3; do
            ./gradlew :caffeine:compileJava --no-daemon && exit 0
            echo "Attempt $i failed; retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Package
        uses: docker://eclipse-temurin:21-jdk
        shell: sh
        run: |
          export CI=true
          for i in 1 2 3; do
            ./gradlew :caffeine:jar --no-daemon && exit 0
            echo "Attempt $i failed; retrying in 20s..."
            sleep 20
          done
          exit 1

      # Full :caffeine:test runs the @CacheSpec combinatorial suite, which
      # generates a huge cartesian product of cache configurations and takes
      # far too long (and too much memory — the project's own pitest config
      # notes BoundedLocalCache/UnboundedLocalCache OOM its process during
      # coverage collection "regardless of heap size") for a basic CI check.
      # Run a minimal core set instead: self-contained data-structure classes
      # with focused, standalone tests, matching the same exclusion list the
      # project's own pitest config already uses for this exact reason
      # (gradle/plugins/caffeine-plugin's pitest block in caffeine/build.gradle.kts).
      - name: Run unit tests
        uses: docker://eclipse-temurin:21-jdk
        shell: sh
        run: |
          export CI=true
          for i in 1 2 3; do
            ./gradlew :caffeine:test --no-daemon --tests "com.github.benmanes.caffeine.cache.CaffeineTest" --tests "com.github.benmanes.caffeine.cache.CaffeineSpecTest" --tests "com.github.benmanes.caffeine.cache.FrequencySketchTest" --tests "com.github.benmanes.caffeine.cache.SchedulerTest" --tests "com.github.benmanes.caffeine.cache.InternerTest" --tests "com.github.benmanes.caffeine.cache.StripedBufferTest" && exit 0
            echo "Attempt $i failed; retrying in 20s..."
            sleep 20
          done
          exit 1
